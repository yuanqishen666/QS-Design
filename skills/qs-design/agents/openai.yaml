interface:
  display_name: "QS Design"
  short_description: "一个入口设计并分流所有目标平台"
  default_prompt: "Use $qs-design as the single entry point. Treat every user-provided reference and every existing implementation as a source of functions, business logic, and contracts only; never carry over its page structure or visual styling. Produce three structurally and visually distinct isolated prototypes with real previews, wait for the user to select one, then implement only the approved direction."
