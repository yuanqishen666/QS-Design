interface:
  display_name: "QS Design"
  short_description: "从业务语义生成视觉优秀、跨端原生且可验证的产品体验"
  default_prompt: "Use $qs-design as the single design entry point. Treat requests to design, optimize, visually improve or refactor as design mode even when phrased as questions; use text-only audit mode only when the user explicitly limits the outcome to inspection, analysis or a report. Treat the design task, not the project, as the context root. Compile an explicit context manifest; never expose rejected or unselected candidate artifacts to a fresh design worker. Before formal directions, establish source-backed Product Truth with visible-affordance allowlists, first-viewport attention order, terminology risk and prototype fidelity/paths. A soft reset keeps Product Truth but carries other design contracts only when the user reauthorizes them. Preserve intentional continuity through a scoped contract, interpret fuzzy language through business meaning and observable outcomes, choose one to three directions according to real uncertainty, and trace dominant decisions to business/art-direction/brand/platform evidence. Convert feedback into preserve/change/do-not-infer/next-experiment deltas. Protect stable element facets during iterative edits and create a propagation map before expanding a selected representative flow. Make structure, hierarchy, spacing, data relations and clear actions explain the interface before adding helper copy. Keep critical facts visible and reserve tooltips for short optional non-interactive information. Design mode cannot finish with prose, tables or ASCII alone: render, inspect and embed a directly viewable preview for every formal direction, and include a runnable entry for clickable or native work. Prototype creation is independent from approval to modify product source."
policy:
  allow_implicit_invocation: true
