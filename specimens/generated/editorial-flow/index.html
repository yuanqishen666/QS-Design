<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长阅读与行动 — QS Specimen</title><style>:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;--a:#6ea8ff;--b:#a58cff}*{box-sizing:border-box}body{margin:0;background:#0a0c11;color:#f7f8fb}.page{width:min(1040px,calc(100% - 32px));margin:auto;padding:56px 0 90px}header{display:grid;grid-template-columns:1fr .7fr;gap:30px;align-items:end;margin-bottom:28px}h1{font-size:clamp(42px,8vw,86px);line-height:.9;letter-spacing:-.06em;margin:8px 0}.meta,.anti{color:#9fa8ba}.anti{border-left:2px solid #ff8068;padding-left:12px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.state{background:#141822;border:1px solid #2b3140;border-radius:22px;padding:16px}.state h2{font-size:12px;color:#aab3c3;letter-spacing:.1em;text-transform:uppercase}.demo{height:240px;border-radius:16px;background:#0d1017;overflow:hidden;padding:18px;position:relative}.layout{height:100%;display:grid;grid-template-columns:1fr 2fr;grid-template-rows:45px 1fr;gap:10px}.layout>*{background:#242b39;border-radius:9px}.layout i{grid-column:1/-1}.layout b{background:linear-gradient(145deg,var(--a),var(--b))}.layout.v1{grid-template-columns:1fr 1fr}.layout.v2{grid-template-columns:.65fr 2fr}.stress{display:flex;flex-direction:column;height:100%;gap:12px}.stress strong{font-size:22px}.stress p{color:#c0c7d4}.stress button,.fallback button{margin-top:auto;align-self:flex-start;border:0;border-radius:10px;padding:9px 13px;background:var(--a);color:#081018}.material{height:100%;position:relative;background:radial-gradient(circle at 65% 25%,color-mix(in srgb,var(--a),transparent 20%),transparent 32%),linear-gradient(145deg,#171d2a,#0b0e14);overflow:hidden}.material i,.material b{position:absolute;border-radius:50%;background:linear-gradient(145deg,var(--a),var(--b));width:120px;aspect-ratio:1;left:18%;top:26%;filter:saturate(1.2)}.material b{width:74px;left:58%;top:48%;opacity:.7}.material span{position:absolute;left:16px;bottom:14px}.material.v1 i{border-radius:28px;transform:rotate(12deg)}.material.v2 i{filter:none;box-shadow:0 18px 40px #0008}.behavior{display:flex;height:100%;flex-direction:column;justify-content:center;gap:18px}.track{height:28px;background:#242a38;border-radius:999px;overflow:hidden}.track i{display:block;width:var(--progress);height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:inherit;transition:width .15s}.behavior input{accent-color:var(--a)}.translation{height:100%;display:grid;grid-template-columns:62px 1fr;gap:10px}.translation nav,.translation main{background:#1c2230;border-radius:12px;padding:10px}.translation nav{display:grid;align-content:start;gap:10px}.translation nav i,.translation main span{display:block;height:18px;border-radius:5px;background:#343c4d}.translation main b{display:block;margin-bottom:22px}.translation main span{margin:10px 0}.translation.v1{grid-template-columns:1fr;grid-template-rows:48px 1fr}.translation.v1 nav{grid-auto-flow:column}.translation.v2{grid-template-columns:1fr}.translation.v2 nav{position:absolute;left:22px;right:22px;bottom:22px;grid-auto-flow:column;z-index:2}.fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}.fallback i{width:90px;aspect-ratio:1;border-radius:28px;background:linear-gradient(145deg,var(--a),var(--b));transition:transform .4s}.fallback.v1 i{transform:scale(.86)}.fallback.v2 i{background:#343b49}.fallback button{margin:0}.note{margin-top:24px;color:#8f98aa}@media(max-width:760px){header{grid-template-columns:1fr}.states{grid-template-columns:1fr}.demo{height:210px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body><main class="page"><header><div><p class="meta">QS SPECIMEN · LAYOUT · editorial-flow</p><h1>长阅读与行动</h1><p>阅读节奏、证据和相关动作沿内容自然出现。</p></div><p class="anti"><strong>反例：</strong>首屏堆满悬浮按钮，正文宽度和行长失控。</p></header><section class="states"><article class="state"><h2>opening</h2><div class="demo"><div class="layout v0"><i></i><b></b><span></span><em></em></div></div></article><article class="state"><h2>reading</h2><div class="demo"><div class="layout v1"><i></i><b></b><span></span><em></em></div></div></article><article class="state"><h2>annotating</h2><div class="demo"><div class="layout v2"><i></i><b></b><span></span><em></em></div></div></article></section><p class="note">平台：cross-platform。本页是决策样张，不是可直接复制的产品模板。</p></main><script>document.querySelectorAll('.behavior input').forEach(input=>input.addEventListener('input',()=>{input.previousElementSibling.style.setProperty('--progress',input.value+'%')}))</script></body></html>
